# Local and dev only. Production uses managed PostgreSQL/Supabase, managed
# Redis and managed RabbitMQ; see deploy/CUTOVER.md.
services:
  postgres:
    # PostGIS is required by the global content schema.
    image: postgis/postgis:16-3.5
    container_name: reelpin-postgres
    environment:
      POSTGRES_USER: reelpin
      POSTGRES_PASSWORD: reelpin
      POSTGRES_DB: reelpin
    ports:
      - "5432:5432"
    volumes:
      - reelpin_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: reelpin-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: reelpin-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - reelpin_rabbitdata:/var/lib/rabbitmq

volumes:
  reelpin_pgdata:
  reelpin_rabbitdata:
