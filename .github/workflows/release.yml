name: release

# Build once, push by digest, deploy that exact digest. A tag can move between
# the dev deploy and the production deploy; a digest cannot, so what production
# runs is bit-for-bit what dev ran.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which host to deploy to
        required: true
        type: choice
        options: [none, dev, production]
        default: none
      digest:
        description: >-
          Promote this already-built digest (sha256:...) instead of building a
          new one. Production should always be given the digest that was tested
          on dev; leave empty only for a dev deploy of the current commit.
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # Skipped when a digest is being promoted: the whole point of promotion is
    # that production runs the bytes dev tested, not a fresh build of them.
    if: inputs.digest == '' || inputs.digest == null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          # Provenance and an SBOM travel with the image, so what is running can
          # be traced back to a commit and a dependency list without a rebuild.
          provenance: mode=max
          sbom: true

      - name: report the digest
        run: echo "pushed ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"

  deploy:
    # Deployment is manual until the cutover. Go does not own traffic yet, and a
    # push-triggered deploy would be a release nobody asked for. Turning this
    # into an automatic dev deploy is step 1 of docs/cutover.md.
    if: |
      always() && github.event_name == 'workflow_dispatch' &&
      inputs.environment != 'none' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: choose the digest to deploy
        # Either the one just built, or the one being promoted. Never a tag.
        run: |
          digest="${{ inputs.digest }}"
          if [ -z "$digest" ]; then
            digest="${{ needs.build.outputs.digest }}"
          fi
          case "$digest" in
            sha256:*) ;;
            *) echo "refusing to deploy '$digest': pass an image digest, not a tag"; exit 1 ;;
          esac
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "deploying ${{ env.IMAGE }}@$digest"

      - name: open an ssh session to the host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy $SSH_USER@$SSH_HOST" >> "$GITHUB_ENV"

      - name: copy the deploy scripts to the host
        run: |
          scp -i ~/.ssh/deploy deploy/reelpin-deploy.sh deploy/reelpin-smoke.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/"
          $SSH "chmod +x /tmp/reelpin-deploy.sh /tmp/reelpin-smoke.sh"

      - name: migrate
        # One migration job, before anything new starts. Migrations are embedded
        # in the maintenance binary, so this needs no checkout on the host.
        run: |
          # --entrypoint is required: the image's entrypoint is the API, so
          # trailing arguments would be handed to the API and the migration
          # would never run.
          $SSH "docker run --rm --env-file /etc/reelpin/${{ inputs.environment }}.env \
            --entrypoint /usr/local/bin/reelpin-maintenance \
            ${{ env.IMAGE }}@${DIGEST} migrate"

      - name: deploy the api
        run: |
          $SSH "sudo /tmp/reelpin-deploy.sh api ${{ inputs.environment }} ${{ env.IMAGE }}@${DIGEST}"

      - name: deploy the worker
        # The worker is deployed separately: an API rollback must be able to
        # leave workers draining RabbitMQ, because nothing else can consume it.
        run: |
          $SSH "sudo /tmp/reelpin-deploy.sh worker ${{ inputs.environment }} ${{ env.IMAGE }}@${DIGEST}"

      - name: smoke test
        run: |
          $SSH "/tmp/reelpin-smoke.sh http://127.0.0.1:8000"
