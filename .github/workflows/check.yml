name: check

on:
  # Every layer of a stack is checked, not only the ones based on a trunk.
  pull_request:
  push:
    branches: [dev, main]

env:
  GO_VERSION: "1.26.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # One target, the same one a person runs before pushing. When CI and the
      # local command diverge, the local one stops being run.
      - name: make check
        run: make check

      - name: the contract is valid OpenAPI
        # Pinned validator; a spec that does not lint cannot generate a client.
        run: npx --yes @redocly/cli@1.34.1 lint api/openapi.yaml --format=stylish

      - name: no breaking v2 change against the latest released contract
        # Compares the PR's spec with the one on the target branch. A breaking
        # change to a released v2 operation requires /api/v3, not an edit.
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          if ! git show "$base:api/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null; then
            echo "no contract on $base yet; nothing to break"
            exit 0
          fi
          set +e
          output=$(docker run --rm -v /tmp/base-openapi.yaml:/base.yaml:ro \
            -v "$PWD/api/openapi.yaml:/head.yaml:ro" \
            tufin/oasdiff:v1.10.5 breaking /base.yaml /head.yaml \
            --fail-on ERR 2>&1)
          status=$?
          set -e
          echo "$output"
          if echo "$output" | grep -q "failed to load base spec"; then
            # A base that does not parse cannot be broken against. This happens
            # exactly once per spec-format migration.
            echo "base spec is not parseable; skipping the comparison"
            exit 0
          fi
          exit $status

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS carries the spatial types the map schema needs; pgvector is
        # installed into the running container below, because no published
        # image carries both.
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: reelpin
          POSTGRES_DB: reelpin
          # No password at all, rather than a fake one written down. The
          # container exists for the length of this job and is reachable only
          # from it, and a committed password fails secret scanning however
          # throwaway it is.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reelpin"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: install pgvector into the postgres service
        run: |
          container=$(docker ps --filter "ancestor=postgis/postgis:16-3.5" --format "{{.ID}}" | head -n1)
          if [ -z "$container" ]; then
            echo "the postgres service container was not found"
            docker ps
            exit 1
          fi
          docker exec "$container" bash -c \
            "apt-get update -qq && apt-get install -y -qq postgresql-16-pgvector"

      - name: integration tests
        run: |
          export TEST_DATABASE_URL="postgres://reelpin@localhost:5432/reelpin"
          make test-integration
