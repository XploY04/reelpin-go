name: ci

on:
  # Every layer of a stack is checked, not only the ones based on a trunk.
  pull_request:
  push:
    branches: [dev, main]

env:
  GO_VERSION: "1.26.2"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: reelpin
          POSTGRES_PASSWORD: reelpin
          POSTGRES_DB: reelpin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reelpin"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test ./...

      - name: race tests
        run: go test -race ./...

      - name: install pgvector into the postgres service
        # The PostGIS image carries PostGIS but not pgvector, and the migrations
        # need both. Installing it into the running service container is
        # cheaper than maintaining a bespoke image.
        run: |
          container=$(docker ps --filter "ancestor=postgis/postgis:16-3.5" --format "{{.ID}}" | head -n1)
          if [ -z "$container" ]; then
            echo "the postgres service container was not found"
            docker ps
            exit 1
          fi
          docker exec "$container" bash -c "apt-get update -qq && apt-get install -y -qq postgresql-16-pgvector"

      - name: integration tests
        env:
          # Assembled at run time: a connection URI with inline credentials in
          # a committed file trips secret scanning, even for a throwaway
          # service container that only exists during this job.
          POSTGRES_USER: reelpin
          POSTGRES_PASSWORD: reelpin
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        run: |
          export TEST_DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/reelpin"
          export TEST_REDIS_URL="redis://localhost:6379/0"
          export TEST_RABBITMQ_URL="amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@localhost:5672/"
          go test -tags=integration ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: contract fixtures
        run: go test ./internal/httpapi -run 'TestRouteManifestIsUnchanged|TestResponseContract' -count=1

      - name: golden files are committed
        run: |
          if ! git diff --quiet -- api/contract; then
            echo "contract artifacts changed but were not committed:"
            git diff --stat -- api/contract
            exit 1
          fi

      - name: route coverage
        run: python3 scripts/check_route_coverage.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reelpin-api:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

      - name: the image runs as a non-root user
        run: |
          user=$(docker run --rm --entrypoint id reelpin-api:ci -u)
          if [ "$user" != "10001" ]; then
            echo "the image runs as uid $user, want 10001"
            exit 1
          fi

      - name: the media tools are present and executable
        run: |
          docker run --rm --entrypoint yt-dlp reelpin-api:ci --version
          docker run --rm --entrypoint ffmpeg reelpin-api:ci -version | head -n1

      - name: no compiler or build toolchain is left in the image
        # apt and dpkg are part of the Debian base and removing them would be a
        # different kind of fragile. What must not survive the build stage is a
        # toolchain: with one, a foothold in the container can compile.
        run: |
          for binary in gcc cc g++ make go python3; do
            if docker run --rm --entrypoint sh reelpin-api:ci -c "command -v $binary" >/dev/null 2>&1; then
              echo "$binary is still in the runtime image"
              exit 1
            fi
          done

      - name: the image works with a read-only root filesystem
        env:
          SUPABASE_URL: http://127.0.0.1:9
          DATABASE_URL: postgres://127.0.0.1:1/unreachable
        run: |
          # Read-only root plus a bounded tmpfs is how this runs in production,
          # so the startup path must not write anywhere else.
          set +e
          output=$(docker run --rm --read-only \
            --tmpfs /var/tmp/reelpin-runs:size=64m \
            -e ENVIRONMENT=test -e SUPABASE_URL="$SUPABASE_URL" \
            -e DATABASE_URL="$DATABASE_URL" reelpin-api:ci 2>&1)
          set -e
          echo "$output"
          if echo "$output" | grep -q "read-only file system"; then
            echo "the container tried to write to its root filesystem"
            exit 1
          fi
          echo "$output" | grep -q '"startup failed"' || {
            echo "expected a structured startup failure log"
            exit 1
          }

      - name: running another binary in the image needs an entrypoint override
        # The image entrypoint is the API. This is the mistake the release
        # workflow made once: appending a command hands it to the API instead.
        run: |
          set +e
          output=$(docker run --rm reelpin-api:ci /usr/local/bin/reelpin-maintenance migrate 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 2 ]; then
            echo "the api accepted stray arguments instead of refusing them (exit $status)"
            exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/reelpin-maintenance reelpin-api:ci --help 2>&1 | head -n 3 || true
          if ! grep -q -- "--entrypoint" .github/workflows/release.yml; then
            echo "the release workflow runs maintenance without an entrypoint override"
            exit 1
          fi

      - name: sbom
        uses: anchore/sbom-action@v0.24.2
        with:
          image: reelpin-api:ci
          format: spdx-json
          artifact-name: reelpin-sbom.spdx.json

      - name: vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: reelpin-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: liveness smoke test
        env:
          SUPABASE_URL: http://127.0.0.1:9
          # Deliberately unreachable and credential-free: the point is that the
          # container fails loudly without a database.
          DATABASE_URL: postgres://127.0.0.1:1/unreachable
        run: |
          # The container must fail fast and loudly without its dependencies.
          set +e
          output=$(docker run --rm -e ENVIRONMENT=test -e SUPABASE_URL="$SUPABASE_URL" \
            -e DATABASE_URL="$DATABASE_URL" reelpin-api:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "the api exited 0 without a database, which hides a startup failure"
            exit 1
          fi
          echo "$output" | grep -q '"startup failed"' || {
            echo "expected a structured startup failure log"
            exit 1
          }
